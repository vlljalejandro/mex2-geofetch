# =============================================================================
# NetCDF4 Multi-Variable Cube Writer Configuration
# =============================================================================
# Writes a NetCDF4 file containing one or more variables, each built from
# one or more GeoTIFFs sharing a common master grid.
#
# Per-variable output shape is determined automatically from the input:
#
#   input: single file (1 band)   →  variable stored as (y, x)
#   input: single file (N bands)  →  variable stored as (band, y, x)
#   input: list/glob of files     →  variable stored as (band, y, x)
#
# Usage:
#   python 04_cube_raster.py [config_path]
#   (defaults to config/04_cube_raster.yaml)
# =============================================================================


# -----------------------------------------------------------------------------
# Paths
# -----------------------------------------------------------------------------
paths:
  master_grid: "data/00_base_grid/maaden_base_grid60m.tif"
  output_nc:   "data/04_cube_data/aeromag_hr60m.nc"


# -----------------------------------------------------------------------------
# Variables
# -----------------------------------------------------------------------------
# Each key under 'variables' becomes a variable inside the .nc file.
#
# apply_mask : true (default) — pixels where master == 0 are set to NaN
#              false           — no masking applied
#
# input — one of:
#   file  : "path/to/file.tif"               (single file)
#   files :                                    (explicit ordered list)
#     - "path/to/band1.tif"
#     - "path/to/band2.tif"
#   glob  :                                    (dir + pattern, sorted)
#     dir:     "path/to/dir"
#     pattern: "*.tif"
# -----------------------------------------------------------------------------
variables:

  aeromag:
    apply_mask: true
    input:
      files:
      - "data/03_snap_data/aeromag_hr60m/snapped_bilinear_MAG_AMF.tif"
      - "data/03_snap_data/aeromag_hr60m/snapped_bilinear_MAG_AMF_RTP.tif"
      - "data/03_snap_data/aeromag_hr60m/snapped_bilinear_MAG_AMF_RTP1VD.tif"
      - "data/03_snap_data/aeromag_hr60m/snapped_bilinear_MAG_AMF_RTP2VD.tif"
      - "data/03_snap_data/aeromag_hr60m/snapped_bilinear_MAG_AMF_RTPTILT.tif"
      - "data/03_snap_data/aeromag_hr60m/snapped_bilinear_MAG_AMF_RTPHG.tif"
      - "data/03_snap_data/aeromag_hr60m/snapped_bilinear_MAG_AMF_ANS.tif"
      - "data/03_snap_data/aeromag_hr60m/snapped_bilinear_MAG_HGLAT.tif"
      - "data/03_snap_data/aeromag_hr60m/snapped_bilinear_MAG_HGLONG.tif"
      - "data/03_snap_data/aeromag_hr60m/snapped_bilinear_DTM.tif"
      - "data/03_snap_data/aeromag_hr60m/inferred_MAG_AMF_RTPSR.tif"


# -----------------------------------------------------------------------------
# Processing
# -----------------------------------------------------------------------------
# compress_level : zlib deflate level (1–9). Default: 4.
#                    1 → fastest / largest
#                    4 → balanced
#                    9 → smallest / slowest
processing:
  compress_level: 4


# -----------------------------------------------------------------------------
# Metadata
# -----------------------------------------------------------------------------
# Top-level keys not matching a variable name → written as global attributes.
# Keys matching a variable name (e.g. 'mag', 'grav') → written as attributes
# on that specific variable.
# -----------------------------------------------------------------------------
metadata:
  project:      "Maaden Project"
  resolution:   "60m"
  crs:          "UTM Zone 37N / WGS-84"
  created_by:   "M[EX]2"
  nodata_value: "NaN"

  aeromag:
    project:      "Maaden Project"
    sensor:       "High-Resolution Aeromagnetic Survey"
    product:      "Magnetic Field Derivatives"
    resolution:   "60m"
    crs:          "UTM Zone 37N / WGS-84"
    created_by:   "M[EX]2"
    nodata_value: "NaN"
    units:        "varies by band (see band_descriptions)"
    bands:        "AMF, RTP, RTP1VD, RTP2VD, RTPTILT, RTPHG, ANS, HGLAT, HGLONG, DTM, RTP_SR"
    band_descriptions: "AMF=Analytic Signal of Magnetic Field; RTP=Reduced-to-Pole; RTP1VD/RTP2VD=RTP 1st/2nd Vertical Derivative; RTPTILT=RTP Tilt Angle; RTPHG=RTP Horizontal Gradient; ANS=Analytic Signal; HGLAT/HGLONG=Horizontal Gradient Latitude/Longitude components; DTM=Distance to Magnetic Source; RTP_SR=Super-resolution RTP infilling survey coverage gaps via learned spatial inference"
    correction:   "Aircraft compensation, lag correction, diurnal removal, tie-line levelling, micro-levelling, IGRF correction applied"


# -----------------------------------------------------------------------------
# Running Code
# -----------------------------------------------------------------------------
# python scripts/04_cube_raster.py