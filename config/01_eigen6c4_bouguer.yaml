# Configuration for 01_eigen6c4_bouguer.py
# ─────────────────────────────────────────
# Gravity functionals from the EIGEN-6C4 spherical harmonic model, computed
# locally with pyshtools (no web service). Values are on the GRS80 ellipsoid
# (h = 0), synthesised directly at the output pixels.
#
# The EIGEN-6C4.gfc file (~90 MB) is downloaded on first run (link looked up in
# the ICGEM model table) and cached at eigen6c4_params.gfc_path.
# If the download fails, get it manually from:
#   https://icgem.gfz.de/home  →  Table of Models  →  EIGEN-6C4  →  gfc
#
# Model info:
#   EIGEN-6C4  –  degree/order 2190  –  GFZ Potsdam + GRGS Toulouse (2014)
#   Reference: Förste et al. (2014), doi:10.5880/icgem.2015.1
#
# Resolution guide (lmax_expand, half wavelength):
#   360  →  ~55 km  (regional overview)
#   720  →  ~28 km  (good for most studies)
#   1080 →  ~18 km  (high detail)
#   2190 →  ~9 km   (full model)

# -----------------------------------------------------------------------------
# Parameters
# -----------------------------------------------------------------------------

paths:
  # Path to your AOI file (GeoPackage, Shapefile, GeoJSON …).
  # Relative paths are resolved from the project root (two levels above config/).
  # The output covers the AOI bounding box.
  aoi: aoi/shield_basins_area.zip

  # Root folder for all EIGEN-6C4 output.
  # Sub-folders created automatically:
  #   mosaic/  – final GeoTIFFs, EIGEN6C4_<functional>.tif (EPSG:4326, mGal)
  output_base: data/01_raw_data/raw_eigen6c4

eigen6c4_params:
  # Cached model coefficient file (downloaded on first run if missing).
  gfc_path: data/01_raw_data/raw_eigen6c4/EIGEN-6C4.gfc

  # Maximum spherical harmonic degree. See resolution guide in the header above.
  lmax_expand: 720

  # Available functionals:
  #   gravity_anomaly_bg   – Simple Bouguer anomaly: free-air − 2πGρh    (mGal)
  #   gravity_anomaly      – Free-air gravity anomaly                     (mGal)
  #   gravity_disturbance  – Gravity disturbance (g − γ at the same point) (mGal)
  #   gravity              – Total gravity, normal gravity + disturbance   (mGal)
  functionals:
    - gravity_anomaly_bg
    - gravity_anomaly
    # - gravity_disturbance
    # - gravity

  # Crustal density for the Bouguer plate correction [g/cm³].
  # Only used when 'gravity_anomaly_bg' is requested.
  density: 2.67

  # DEM GeoTIFF (metres, any CRS) for the Bouguer correction, averaged to the
  # output pixels; heights below sea level are set to 0 (onshore correction only).
  # Default: COP30 from 01_opentopo_download.py with
  #   output_base: data/01_raw_data/raw_copglo_dem30m
  # Only needed when 'gravity_anomaly_bg' is requested.
  dem_path: data/01_raw_data/raw_copglo_dem30m/COP30_subset.tif

  # Output pixel size in degrees. The field is evaluated at every pixel, so a
  # step finer than the model resolution (0.25° at lmax 720) only gives a
  # smoother raster, not more detail. Runtime grows with the number of rows.
  grid_step: 0.01

# -----------------------------------------------------------------------------
# Running Code
# -----------------------------------------------------------------------------
# python scripts/01_eigen6c4_bouguer.py
