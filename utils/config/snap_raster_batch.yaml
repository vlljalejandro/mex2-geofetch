# =============================================================================
# Raster Alignment (Snap to Master Grid) — Batch Configuration
# =============================================================================
# Used by utils/snap_raster_batch.py
# All relative paths are resolved against the project root.


# -----------------------------------------------------------------------------
# Paths
# -----------------------------------------------------------------------------
paths:
  master_grid: "data/00_base_grid/maaden_base_grid60m.tif"
  input_dir:   "data/01_raw_data/raw_magnetic"     # folder searched by each pattern
  recursive:   true                                # also search all subfolders of input_dir
  output_dir:  "data/03_snap_data/bilinear"


# -----------------------------------------------------------------------------
# Batch
# -----------------------------------------------------------------------------
# Each pattern is matched against paths.input_dir (and its subfolders
# when paths.recursive is true).
# The output filename is auto-built as:
#   snapped_{resample_alg}_{SUFFIX}.tif
# where SUFFIX is the pattern with the leading *_ and trailing .tif removed.
# e.g.  *_AMF.tif  →  snapped_bilinear_AMF.tif
#
batch:
  patterns:
    - "*_DTM.tif"
    - "*_AMF.tif"
    - "*_AMF_ANS.tif"
    - "*_AMF_RTP.tif"
    - "*_AMF_RTP1VD.tif"
    - "*_AMF_RTP2VD.tif"
    - "*_AMF_RTPHG.tif"
    - "*_AMF_RTPTILT.tif"
    - "*_HGLAT.tif"
    - "*_HGLONG.tif"
    # - "*_RTP.tif"
    # - "*_RTP_ANSIG.tif"
    # - "*_RTP_FVD.tif"
    # - "*_TMI.tif"


# -----------------------------------------------------------------------------
# Processing
# -----------------------------------------------------------------------------
processing:
  resample_alg:     "bilinear"
  apply_mask:       true
  merge_output:     true
  overlap_strategy: "first"      # first | last | average
  strip_height:     64000
  src_nodata:       -9999        # written to input bands that have no NoData declared
                                 # (header only); set to null to disable


# -----------------------------------------------------------------------------
# Output Format
# -----------------------------------------------------------------------------
output_format:
  bigtiff:    "IF_SAFER"
  compress:   "LZW"
  predictor:  2
  block_size: 512


# -----------------------------------------------------------------------------
# Running
# -----------------------------------------------------------------------------
#   python utils/snap_raster_batch.py